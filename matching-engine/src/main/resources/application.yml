server:
  tomcat:
    # 默认 maxKeepAliveRequests=100，会在高并发下频繁关闭连接；下单是一单一请求，
    # 连接复用能明显降低重连开销。-1 = 不限制；公网部署可改成较大的有限值（如 10000）。
    max-keep-alive-requests: -1
    # 默认等于 connectionTimeout；显式给 60s，避免连接空闲过早被关闭。
    keep-alive-timeout: 60s

spring:
  application:
    name: matching-engine

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发默认值；部署时用环境变量 DB_URL / DB_USERNAME / DB_PASSWORD 覆盖
    url: "${DB_URL:jdbc:mysql://localhost:3306/db_exchange?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: "${DB_USERNAME:admin}"
    password: "${DB_PASSWORD:admin}"
    hikari:
      pool-name: matching-engine-pool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 2000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 表主键统一自增；不使用雪花 ID
      id-type: auto

app:
  # WebSocket 盘口推送模块（com.me.websocket）：前端订阅交易对，服务端默认每 500ms
  # 查询一次撮合引擎内存订单簿并推送；同一帧附带该交易对最新 50 笔成交与各周期当前 K 线
  # （都是内存缓存），成交 / K 线不需要单独订阅。切换交易对时重新订阅，新订阅替换旧订阅。
  websocket:
    # 推送间隔（毫秒）
    push-interval-ms: 500
    # 客户端未指定 depth 时，买卖两边各返回的价位数量
    default-depth: 20
    # 单边价位上限，客户端请求更大时按该值截断
    max-depth: 100
    # 握手 Origin 白名单，逗号分隔；* = 不限制（演示环境默认）。
    # 生产部署建议收敛为前端域名，例如 https://exchange.example.com
    allowed-origin-patterns: "*"
    # 单次发送超时与单连接发送缓冲；客户端读取过慢时断开该连接，避免拖住推送线程
    send-time-limit-ms: 5000
    send-buffer-size-bytes: 524288
    # 交易端点 /ws/trade：客户端 login 后通过 Aeron IPC 把下单/撤单请求发给币币模块。
    # 只 ack“已通过币币校验并进入 ingress ring”，不等待 Kafka / 冻结 / 撮合结果。
    trading:
      enabled: true
      path: /ws/trade
      allowed-origin-patterns: "*"
      # 单连接每秒最多提交的订单/撤单请求数；<=0 表示不限制
      max-orders-per-second: 50
      # 单连接同时等待 ack 的最大请求数；超过返回 RATE_LIMITED
      max-pending-requests: 100
      # 发出 Aeron 请求后等待 ack 的时长；超时返回 orderAckTimeout，客户端应查单而不是自动重试
      ack-timeout-ms: 3000
      # 超时扫描间隔（ms）
      ack-sweep-interval-ms: 1000
      # 二进制连接单个 AckBatch 帧最多携带的 ack 条数；1 = 每帧一条（用于 A/B 对比）
      ack-batch-size: 64
      # 单条客户端 JSON / SBE 二进制消息上限；AckBatch 帧超出时会自动拆帧
      max-message-bytes: 8192
      # 多 WS 实例部署时用于生成 connectionId 前缀；当前单实例保持 1
      instance-id: 1

  # Aeron：WS → 币币模块的同机 IPC 通道。
  # 当前与 Spring Boot 同进程运行，使用内嵌 media driver + aeron:ipc；
  # 后续 WS 独立部署时可改为 standalone driver 或 aeron:udp。
  aeron:
    enabled: true
    # media driver 目录；相对路径按进程工作目录解析。开发环境启动时清空。
    dir: "${AERON_DIR:./target/aeron}"
    channel: "aeron:ipc"
    # WS → 币币：下单/撤单请求；实际使用 request-stream-id .. +stream-count-1
    request-stream-id: 1001
    # 币币 → WS：ingress ack；实际使用 ack-stream-id .. +stream-count-1
    # 与 request 分片下标一一对应，必须和 request 段不重叠
    ack-stream-id: 1101
    # 并行分片数：接收 poller、ack poller、WS publication 各 N 路
    # 8 路是当前机器上的吞吐拐点；16 路线程/term buffer 竞争反而下降
    stream-count: 8
    embedded-driver: true
    dir-delete-on-start: true
    term-buffer-length: 16777216
    # 单条 Aeron 消息上限；下单/撤单请求远小于该值
    max-message-bytes: 16384

  kafka:
    # 关闭后不启动任何裸 consumer/topic initializer
    enabled: true
    # 诊断：逗号分隔禁用指定消费 stage，例如 order-command,marketdata,funds-flow；
    # stage 名称见 KafkaConsumerConfiguration 的 runner 名。默认空 = 全部启用。
    # disabled-consumers: ""
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    # 事务型 producer 的唯一标识；多实例部署时每个实例必须不同（pod name / 序号）
    instance-id: "${KAFKA_INSTANCE_ID:local}"
    transaction-id-prefix: "${KAFKA_TRANSACTION_ID_PREFIX:funds-flow-tx-}"
    poll-timeout-ms: 1000
    # 整批失败后的重试间隔
    retry-backoff-ms: 1000
    # REST 下单/充值使用幂等、非事务 producer；池大小、借出超时、同步 ack 超时
    rest-producer-pool-size: 32
    rest-borrow-timeout-ms: 3000
    rest-send-timeout-ms: 3000
    # 仅 REST producer 覆盖全局 linger/batch：50ms 凑批；448KB ≈ 2000 条 OrderCommand
    # （单条约 197B JSON + 8B key + Kafka record 开销，约 235B/条）
    rest-producer-linger-ms: 50
    rest-producer-batch-size-bytes: 458752
    consumer:
      # offset 只能通过事务提交，禁止自动提交
      enable-auto-commit: false
      isolation-level: read_committed
      auto-offset-reset: earliest
      # 禁止 broker 自动创建 topic（避免默认 1 分区）
      allow-auto-create-topics: false
      # 批量消费：逐条 topic（me.account.commands）单次 poll 最多 2000 条；
      # broker 凑够约 1MB 或等待 50ms 即返回
      max-poll-records: 2000
      # 八个被消费的 -batch topic（下单入口 + 七个下游）的一条 record 内含 msgList，
      # 限制每次 poll 的 record 数，避免一次事务处理过多元素
      # （10 条 × 每条最多 2000 元素）。
      batch-max-poll-records: 10
      fetch-max-wait-ms: 50
      # 资金流水归档 stage 单独覆盖：一次 poll 最多 100 条 record、fetch 等 200ms；
      # FundsFlowConsumer 再把流水按 20k 行分块写入，摊薄 QWP ack 与 Kafka commit
      # 的按批固定开销。其他 batch topic 不受影响。
      funds-flow:
        max-poll-records: 100
        fetch-max-wait-ms: 200
      fetch-min-size-bytes: 1048576
      # 逐条 topic 处理 2000 条会阻塞 poll；给足余量，避免批次处理期间触发 rebalance
      max-poll-interval-ms: 600000
      session-timeout-ms: 45000
      # 各 stage 的并发 consumer 数，未配置默认 1。
      # order-command 的消息体是 OrderCommandBatch，key=symbol，同一 symbol 只落一个分区、
      # 由同一个 consumer 处理，因此按分区并行消费不破坏 symbol 内的价格-时间优先；
      # 8 个 consumer 对应 8 个分区。
      # account / freeze-result 等仍为单 consumer，保序语义不变。
      concurrency:
        order-command: 8
        # 撤单 topic 按 symbol 分区：8 个 consumer 对应 8 分区，不同 symbol 的撤单并行处理，
        # 同一 symbol 仍由单 consumer 串行（消费端再用线程池并发查询 / 更新委托）。
        order-cancel: 8
        # 订单冻结按 symbol 分区后，账户冻结阶段可以按分区并行；同一 symbol 仍由单 consumer
        # 串行处理，价格-时间优先不变。
        account-order-freeze: 8
        # 冻结回执 topic 已按 symbol 分区；撮合阶段可按分区并行，同一 symbol 只由一个
        # consumer 处理，价格-时间优先不变。下游行情/结算也按 symbol 分组发送。
        order-freeze-result: 2
        # 清算命令按 symbol 分区；8 个 consumer 对应 8 分区，不同 symbol 的清算并行，
        # 同一 symbol 仍由单 consumer 串行（同一用户的余额由账户分片锁保护）。
        account-settlement: 8
        # 资金流水按 userId 分区，8 个 consumer 并行写 QuestDB（topic 8 分区）。
        funds-flow: 8
        # 委托历史按 symbol 分区；8 个 consumer 对应 8 分区，不同 symbol 并行归档 QuestDB，
        # 同一 symbol 仍由单 consumer 串行。
        order-history: 8
        # 撮合对按 symbol 分区，admin 用户成交归档与 order-history 一样按分区并行；
        # 同一 symbol 的成交仍由单 consumer 串行写入 QuestDB。
        user-trade: 8
    producer:
      acks: all
      enable-idempotence: true
      # 一批一个事务；单批可达 2000 条，给足事务提交时间
      transaction-timeout-ms: 180000
      # broker 不可用时限制 send() 元数据等待，避免阻塞消费/HTTP 线程
      max-block-ms: 5000
      delivery-timeout-ms: 120000
      # 同一批次的记录先全部入队，由客户端按 partition 聚合；少量 linger 提高批合并率
      linger-ms: 2
      batch-size-bytes: 32768
    # 有状态模块（委托 / 账户）的 FIFO 事务提交管线：
    # runner 在模块锁内把输出打包入队，唯一的 committer 线程按入队顺序提交。
    # 队列满时 runner 阻塞入队（背压），不拒绝、不超时。
    commit:
      # 队列容量；必须能容纳同时等待提交的批次，避免 committer 凑包时互相等待。
      queue-capacity: 128
      # 一个 Kafka 事务最多合并的包数；只合并且已排队的包，不额外等待。
      max-packages-per-transaction: 16
    admin:
      auto-create: true
      fail-fast: false
    topics:
      # 下单入口与四个下游输出 topic 均为批量消息（一条 record 内含 msgList）；
      # 只有充值等非冻结资金命令 me.account.commands 仍是逐条消息。
      account-commands: me.account.commands
      # ORDER_FREEZE 单独一条链路，key=symbol，每个 symbol 一条批量消息，与充值（key=userId）解耦
      account-order-freeze-commands: me.account.order-freeze-commands-batch
      order-commands: me.order.commands-batch
      # 撤单批量消息：独立 Disruptor 按「单 symbol 1000 条或 20ms」聚合，key=symbol
      order-cancels: me.order.cancels-batch
      account-settlements: me.account.settlements-batch
      order-freeze-results: me.order.freeze-results-batch
      # 撮合对：key=symbol；行情模块消费生成 K 线，admin 消费归档用户成交记录
      match-pair: me.match-pair-batch
      # 资金流水按 userId 分组、key=userId；8 个 consumer 并行归档
      funds-flow: me.funds-batch
      # 委托历史：撤单 / 撮合完成的委托按 symbol 分组，key=symbol，admin 消费并归档 QuestDB
      order-history: me.order.history-batch
      # 账户操作全局序列：每条输入消费记录(topic/partition/offset)与批次 accountSeq 的映射，
      # 与资金流水/冻结回执/消费 offset 同事务提交，供快照恢复后按序回溯 Kafka 消息
      account-offset-seq: me.account.offset-seq-batch
      # 委托操作全局序列：每条输入消费记录与批次 orderSeq 的映射，
      # 与撮合输出/结算命令/委托历史/消费 offset 同事务提交
      order-offset-seq: me.order.offset-seq-batch
    groups:
      account: account-command-consumer
      account-order-freeze: account-order-freeze-consumer
      account-settlement: account-trade-settlement-consumer
      order: order-command-consumer
      order-cancel: order-cancel-consumer
      order-freeze-result: order-freeze-result-consumer
      marketdata: marketdata-trade-consumer
      user-trade: admin-user-trade
      admin: admin-funds-flow
      order-history: admin-order-history
    topic:
      partitions: 8
      replication-factor: 1

  # 备份快照：POST /api/v1/admin/snapshots 同步触发。
  # 快照会先拿三个入口锁，等待内部链路排空和两个 committer 的队列提交完成，
  # 然后在账户 / 委托模块锁内复制内存，校验「委托剩余冻结 == 账户冻结」后原子写文件。
  snapshot:
    # 输出目录；相对路径按进程工作目录解析
    directory: "${SNAPSHOT_DIR:./snapshots}"
    # 等入口批次处理完 + 内部 topic 排空 + committer flush 的总超时。
    # 入口 consumer 在此期间阻塞在入口锁上，本值必须明显小于
    # app.kafka.consumer.max-poll-interval-ms（默认 600000），否则会触发 rebalance。
    drain-timeout-ms: 120000
    # 获取下单 / 撤单 / 充值三个入口锁的超时
    entry-lock-timeout-ms: 30000
    # 排空后获取账户 / 委托模块锁的超时
    module-lock-timeout-ms: 30000
    # 写文件前校验每个 (userId, currency) 的委托剩余冻结与账户冻结相等
    validate-invariant: true
    # true 输出带缩进的 JSON，便于人工查看；默认紧凑格式
    pretty-print: false
    # 启动恢复：加载快照 → 恢复内存 → 重放快照切点之后已提交的输入 → 对齐消费 offset。
    # 默认关闭；开启后恢复失败会阻止 consumer 启动。
    recovery:
      enabled: "${SNAPSHOT_RECOVERY_ENABLED:false}"
      # >0 指定 backup id；0 表示取最新一条
      backup-id: "${SNAPSHOT_RECOVERY_BACKUP_ID:0}"
      # 非空时直接读文件，优先于 backup-id（MySQL 元数据丢失的灾备场景）
      file: "${SNAPSHOT_RECOVERY_FILE:}"
      # 开启恢复但找不到可用快照时是否阻止启动
      fail-if-missing: true
      # 严格校验 [快照 offset, broker committed offset) 内可见记录与 offset-seq 映射完全一致
      strict-validation: true
      # 一次恢复最多允许的 offset-seq 映射条数，超出要求重新做快照
      max-mappings: 5000000
      fetch-timeout-ms: 60000
      offset-timeout-ms: 60000
      admin-timeout-ms: 30000

  currency:
    ingress:
      # HTTP 下单先非阻塞写入 Disruptor，handler 维护 Map<symbol, List<订单>>；
      # 任一 symbol 达到 batch-size 或定时 tick 到达时，把 map 中所有 symbol 的订单
      # 分别封装成 OrderCommandBatch（key=symbol）发往 me.order.commands-batch。
      # ring 槽位数，必须是 2 的幂；满时下单接口返回 503，不无限排队。
      ring-size: 65536
      # 单个 symbol 的待发送订单达到该数量即 flush 整个 map
      batch-size: 2000
      # 聚合时间窗口（ms）；定时 tick 触发发送，命令最多等待这么久
      flush-interval-ms: 50
      # false 时只把命令从 ring 中 drain 掉，不发送 Kafka；
      # 用于隔离压测 WS → Aeron → 币币 → ingest ring 这一段
      publish-enabled: true

    # 撤单入口：与下单入口独立的 Disruptor。handler 维护 Map<symbol, List<撤单>>，
    # 任一 symbol 达到 batch-size 或定时 tick 到达时，把 map 中所有 symbol 的撤单
    # 分别封装成 OrderCancelBatch（key=symbol）发往 me.order.cancels-batch。
    cancel-ingress:
      # ring 槽位数，必须是 2 的幂；满时撤单接口返回 503
      ring-size: 65536
      # 单个 symbol 的待发送撤单达到该数量即 flush 整个 map
      batch-size: 1000
      # 聚合时间窗口（ms）；命令最多等待这么久
      flush-interval-ms: 20
      # false 时只 drain 撤单 ring，不发送 Kafka
      publish-enabled: true

  marketdata:
    # 每个交易对保留最新 50 笔成交在内存：消费线程立即写缓存，最新成交接口与盘口 WebSocket
    # 都只读缓存；md_trade 与 K 线一样由后台线程按刷新间隔批量落库，启动时从 md_trade 预热。
    # K 线周期，label 大小写敏感：1m 是分钟、1M 是自然月（UTC 每月 1 日对齐）。
    # 逐笔只更新 1m；1m 完成后由后台聚合到其余 8 个周期。
    kline-intervals: 1m,5m,15m,30m,1h,4h,12h,1d,1M
    # 成交明细与 K 线不随每批写入：消费线程只更新内存，后台线程按该间隔把待写成交和有变化
    # 的 K 线 bucket 整批刷新到 QuestDB。调大可进一步降低写入频率，代价是查询延迟变大，
    # 且宕机最多丢失同样时长的成交明细 / K 线增量。
    kline-flush-interval-ms: 1000

  # 机器人模拟模块（com.me.bot）：启动时为默认用户补齐演示资金，订阅币安 miniTicker
  # 最新价，开启自动交易后每个 order-interval-ms 为每个交易对提交一笔限价单
  # （价格=币安最新价，数量=order-notional/最新价，买卖交替）。
  # 开启前先调用币安 REST 测试接口；不可达时接口返回 BINANCE_UNREACHABLE，前端提示
  # 需要配置可访问币安的网络。自动交易状态只保存在内存，重启后默认关闭。
  bot:
    # false = 不启动充值、不允许开启自动交易
    enabled: true
    # 机器人使用的默认用户，启动时按 initial-deposits 补齐余额
    user-id: 9001
    # 订阅并下单的交易对；空列表默认 BTC-USDT、ETH-USDT
    symbols:
      - BTC-USDT
      - ETH-USDT
    # 下单间隔；每个交易对每个间隔下一单，买卖方向交替
    order-interval-ms: 500
    # 单笔名义金额（计价币展示单位，这里为 USDT）；数量按币安最新价换算
    order-notional: 100
    # 启动时补齐到的目标余额（展示单位）；已有余额（可用+冻结）达到目标时不重复充值。
    # 买入需要计价币（USDT），卖出需要基础币（BTC / ETH）。
    initial-deposits:
      USDT: 1000000
      BTC: 100
      ETH: 1000
    binance:
      # 组合流前缀；实际订阅 <prefix>btcusdt@miniTicker/ethusdt@miniTicker
      stream-url: "wss://stream.binance.com:9443/stream?streams="
      # 开启自动交易前调用的测试接口
      ping-url: "https://api.binance.com/api/v3/ping"
      # 可选 HTTP 代理，例如 http://127.0.0.1:7890；留空使用 JVM 系统代理
      # （Windows 读取系统 / IE 代理设置）。也可用环境变量 BINANCE_PROXY 覆盖。
      proxy: "${BINANCE_PROXY:}"
      connect-timeout-ms: 8000
      ping-timeout-ms: 5000
      # WebSocket 断开后的重连间隔
      reconnect-delay-ms: 3000
      # 行情超过该时长未更新时跳过下单，避免用过期价格挂单
      quote-stale-ms: 60000

  questdb:
    # JDBC（PostgreSQL wire）只用于查询/DDL，以及 write-mode=jdbc 时的写入回退
    jdbc-url: "${QUESTDB_JDBC_URL:jdbc:postgresql://localhost:8812/qdb}"
    username: "${QUESTDB_USER:admin}"
    password: "${QUESTDB_PASSWORD:quest}"
    # JDBC 连接池只服务查询/DDL 与 write-mode=jdbc 回退；QWP 写入使用客户端自己的连接池
    pool-size: 8
    connection-timeout-ms: 3000
    # 官方 Java 客户端（QWP over WebSocket，批量写入 + 服务端 ack）
    # write-mode=client 时资金流水/成交/K线/锚点写入走 QWP；jdbc 时退回 JDBC batch 便于 A/B
    # sender_pool_max 必须 >= 并发 QWP 写入线程数（8 funds-flow + 8 order-history +
    # marketdata + 8 user-trade），否则会等满 acquire_timeout 后抛 LineSenderException，
    # 造成消费停摆。
    ingest-conf-string: "${QUESTDB_INGEST_CONF:ws::addr=localhost:9000;username=admin;password=quest;lazy_connect=on;sender_pool_min=1;sender_pool_max=32;auto_flush_rows=75000;auto_flush_interval=1000;acquire_timeout_ms=10000;}"
    write-mode: "${QUESTDB_WRITE_MODE:client}"
